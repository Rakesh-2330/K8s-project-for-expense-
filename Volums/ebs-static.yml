apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 100Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-071b27f852a50e4d4
---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ebs-static-claim
    spec:
      storageClassName: "" # empty string must to explicitly set otherwise default storage class 
      resources:
        requests:
          storage: 5Gi
      volumeName: ebs-static
      volumeMode: Filesystem
      accessModes:
        - ReadWriteOnce
    